<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Merge Table Kelas IX</title>
    <link rel="stylesheet" href="tabelmerge.css">
</head>
<body>

    <h2>Tabel Gabungan Rowspan & Colspan (A - Z)</h2>

    <table class="grid-table">
        
        <tr>
            <td rowspan="3" class="bg-blue">A</td>
            <td rowspan="2" class="bg-blue">B</td>
            <td colspan="2" class="bg-blue">C</td>
            <td rowspan="3" class="bg-blue">D</td>
            <td rowspan="4" class="bg-blue">E</td>
            <td rowspan="2" class="bg-blue">N</td>
            <td rowspan="6" class="bg-blue">H</td>
        </tr>
        
        <tr>
            <td class="bg-cyan">F</td>
            <td class="bg-cyan">G</td>
        </tr>
        
        <tr>
            <td class="bg-blue">I</td>
            <td class="bg-blue">J</td>
            <td class="bg-blue">K</td>
            <td rowspan="3" class="bg-blue">O</td>
        </tr>
        
        <tr>
            <td colspan="5" class="bg-cyan">M</td>
        </tr>
        
        <tr>
            <td rowspan="2" class="bg-blue">P</td>
            <td colspan="2" class="bg-blue">Q</td>
            <td rowspan="2" class="bg-blue">R</td>
            <td class="bg-blue">U</td>
            <td class="bg-blue">V</td>
            <td class="bg-blue">W</td>
        </tr>
        <!-- Baris 6 -->
        <tr>
            <td class="bg-cyan">S</td>
            <td class="bg-cyan">T</td>
            <td class="bg-cyan">X</td>
            <td class="bg-cyan">Y</td>
            <td class="bg-cyan">Z</td>
        </tr>
    </table>

</body>
</html>
