<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Responsif Nilai Siswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 500px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e2f0d9;
        }
    </style>
</head>
<body>

    <h2>Daftar Nilai Siswa Kelas IX</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Nama Lengkap</th>
                    <th>Kelas</th>
                    <th>Nilai</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>Kardashian</td><td>91</td><td>90</td></tr>
                <tr><td>2</td><td>Jane Doe</td><td>92</td><td>85</td></tr>
                <tr><td>3</td><td>Shiloh</td><td>92</td><td>88</td></tr>
                <tr><td>4</td><td>Lois Griffin</td><td>94</td><td>95</td></tr>
                <tr><td>5</td><td>Afgan</td><td>93</td><td>82</td></tr>
                <tr><td>6</td><td>Junkook</td><td>95</td><td>78</td></tr>
                <tr><td>7</td><td>Reza Arap</td><td>94</td><td>92</td></tr>
                <tr><td>8</td><td>Hello World</td><td>91</td><td>87</td></tr>
                <tr><td>9</td><td>Nassar</td><td>95</td><td>80</td></tr>
                <tr><td>10</td><td>Siti Rahma</td><td>94</td><td>94</td></tr>
            </tbody>
        </table>
    </div>

</body>
</html>
